version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: stratum_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stratum_db
      POSTGRES_USER: stratum_user
      POSTGRES_PASSWORD: stratum_secure_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratum_user -d stratum_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stratum_backend
    restart: unless-stopped
    environment:
      DEBUG: "False"
      SECRET_KEY: "stratum-production-secret-key-for-docker-deployment"
      POSTGRES_DB: stratum_db
      POSTGRES_USER: stratum_user
      POSTGRES_PASSWORD: stratum_secure_password_2026
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stratum_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
